<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Campus resource sharing and marketplace for verified HITAM students - buy, sell, lend, borrow and rent with clear exchange records." />
    <title>HITAM Resource Share</title>
    <script>
      (function() {
        try {
          var cookies = document.cookie.split(';');
          var themeCookie = '';
          for (var i = 0; i < cookies.length; i++) {
            var c = cookies[i].trim();
            if (c.indexOf('rs_theme=') === 0) {
              themeCookie = c.substring('rs_theme='.length);
              break;
            }
          }
          var style = 'calm';
          var appearance = 'system';
          if (themeCookie) {
            var parts = themeCookie.split('|');
            if (parts[0] === 'pulse' || parts[0] === 'calm') style = parts[0];
            if (parts[1] === 'light' || parts[1] === 'dark' || parts[1] === 'system') appearance = parts[1];
          }
          var resolvedAppearance = appearance;
          if (appearance === 'system') {
            resolvedAppearance = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-style', style);
          document.documentElement.setAttribute('data-appearance', resolvedAppearance);
          document.documentElement.setAttribute('data-user-appearance', appearance);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
